name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and release
        run: |
          TAG="v$(date -u +%Y-%m-%d)_$(git rev-parse --short HEAD)"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
