openapi: 3.0.0
info:
  title: BomBom API
  version: 1.0.0
tags:
  - name: MonthlyReport
    description: 월간 리포트 관련 API
  - name: MyPage
    description: 마이페이지 관련 API
paths:
  /api/v1/members/me/join-days:
    get:
      operationId: getMemberJoinDays
      summary: 회원 가입일 기준 경과일 조회
      description: 로그인한 회원의 가입일과 가입일 이래로 지난 일수를 조회합니다.
      parameters: []
      responses:
        '200':
          description: 회원 가입일 기준 경과일 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberJoinDaysResponse'
        '401':
          description: 인증 실패
      tags:
        - MyPage
      security:
        - sessionCookie: []
      x-needs-login-member: true
  /api/v1/members/me/rank:
    get:
      operationId: getRankSummary
      summary: 마이페이지 랭킹 요약 조회
      description: |-
        로그인한 회원의 마이페이지 랭킹 카드를 조회합니다.
        rankHistory와 currentRank는 현재월을 제외한 이전달까지의 확정 랭킹을 기준으로 합니다.
        reading 카드의 value는 누적 읽은 아티클 수, streak 카드의 value는 현재 연속 읽기 일수입니다.
      parameters:
        - name: type
          in: query
          required: false
          description: 랭킹 타입 (streak 또는 reading). 생략하면 모든 랭킹 카드를 반환합니다.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: 마이페이지 랭킹 요약 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankSummaryResponse'
        '400':
          description: 잘못된 랭킹 타입 요청
        '401':
          description: 인증 실패
      tags:
        - MyPage
      security:
        - sessionCookie: []
      x-needs-login-member: true
  /api/v1/members/me/reading/calendar:
    get:
      operationId: getReadingCalendar
      summary: 월간 읽기 캘린더 조회
      description: 로그인한 회원의 해당 연·월 일자별 읽기 현황을 조회합니다.
      parameters:
        - name: year
          in: query
          required: true
          description: 조회할 연도
          schema:
            type: integer
            format: int32
            minimum: 1
            x-message: year는 1 이상의 값이어야 합니다.
          x-message: year는 1 이상의 값이어야 합니다.
          explode: false
        - name: month
          in: query
          required: true
          description: 조회할 월 (1-12)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
            x-message: month는 1 이상 12 이하의 값이어야 합니다.
          x-message: month는 1 이상 12 이하의 값이어야 합니다.
          explode: false
      responses:
        '200':
          description: 읽기 캘린더 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingCalendarDayResponse'
        '400':
          description: 잘못된 연·월 파라미터 요청
        '401':
          description: 인증 실패
      tags:
        - MonthlyReport
      security:
        - sessionCookie: []
      x-spring-query-model: MonthlyReportRequest
      x-needs-login-member: true
  /api/v1/members/me/reading/dashboard:
    get:
      operationId: getReadingDashboard
      summary: 월간 읽기 대시보드 조회
      description: |-
        로그인한 회원의 해당 연·월 읽기 통계를 조회합니다.
        읽은 아티클 수(지난 달 대비 증감 포함), 북마크 수, 자주 읽은 뉴스레터를 반환합니다.
      parameters:
        - name: year
          in: query
          required: true
          description: 조회할 연도
          schema:
            type: integer
            format: int32
            minimum: 1
            x-message: year는 1 이상의 값이어야 합니다.
          x-message: year는 1 이상의 값이어야 합니다.
          explode: false
        - name: month
          in: query
          required: true
          description: 조회할 월 (1-12)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
            x-message: month는 1 이상 12 이하의 값이어야 합니다.
          x-message: month는 1 이상 12 이하의 값이어야 합니다.
          explode: false
        - name: limit
          in: query
          required: true
          description: 자주 읽은 뉴스레터 조회 개수
          schema:
            type: integer
            format: int32
            minimum: 1
            x-message: limit는 1 이상의 값이어야 합니다.
          x-message: limit는 1 이상의 값이어야 합니다.
          explode: false
      responses:
        '200':
          description: 읽기 대시보드 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingDashboardResponse'
        '400':
          description: 잘못된 연·월 파라미터 요청
        '401':
          description: 인증 실패
      tags:
        - MonthlyReport
      security:
        - sessionCookie: []
      x-spring-query-model: MonthlyReportDashboardRequest
      x-needs-login-member: true
components:
  schemas:
    ChangeDirection:
      type: string
      enum:
        - UP
        - DOWN
        - SAME
      description: 증감 방향
    FrequentReadNewsletterResponse:
      type: object
      required:
        - rank
        - newsletterId
        - name
        - readCount
      properties:
        rank:
          type: integer
          format: int32
          description: 순위 (1-base)
        newsletterId:
          type: integer
          format: int64
          description: 뉴스레터 ID
        name:
          type: string
          description: 뉴스레터명
        readCount:
          type: integer
          format: int64
          description: 이번 달 읽은 아티클 수
          x-java-primitive: true
      description: 자주 읽은 뉴스레터 정보
    MemberJoinDaysResponse:
      type: object
      required:
        - daysSinceJoined
        - joinedAt
      properties:
        daysSinceJoined:
          type: integer
          format: int32
          description: 가입일 이래로 지난 일수
        joinedAt:
          type: string
          format: date
          description: 가입일 (yyyy-MM-dd)
      description: 회원 가입일 기준 경과일 정보
    MonthlyReportDashboardRequest:
      type: object
      required:
        - year
        - month
        - limit
      properties:
        year:
          type: integer
          format: int32
          minimum: 1
          description: 조회할 연도
          x-message: year는 1 이상의 값이어야 합니다.
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: 조회할 월 (1-12)
          x-message: month는 1 이상 12 이하의 값이어야 합니다.
        limit:
          type: integer
          format: int32
          minimum: 1
          description: 자주 읽은 뉴스레터 조회 개수
          x-message: limit는 1 이상의 값이어야 합니다.
      description: 월간 리포트 대시보드 조회 조건
    MonthlyReportRequest:
      type: object
      required:
        - year
        - month
      properties:
        year:
          type: integer
          format: int32
          minimum: 1
          description: 조회할 연도
          x-message: year는 1 이상의 값이어야 합니다.
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: 조회할 월 (1-12)
          x-message: month는 1 이상 12 이하의 값이어야 합니다.
      description: 월간 리포트 조회 조건
    RankCardResponse:
      type: object
      required:
        - type
        - currentRank
        - rankHistory
        - value
      properties:
        type:
          type: string
          description: '랭킹 타입 (streak: 연속 읽기, reading: 다독왕)'
        currentRank:
          type: integer
          format: int64
          nullable: true
          description: 이전달까지의 최신 확정 순위. 랭킹 이력이 없으면 null입니다.
        rankHistory:
          type: array
          items:
            $ref: '#/components/schemas/RankHistoryResponse'
        value:
          type: integer
          format: int32
          description: 카드 표시 값. streak는 현재 연속 읽기 일수, reading은 누적 읽은 아티클 수입니다.
      description: 마이페이지 랭킹 카드 정보
    RankHistoryResponse:
      type: object
      required:
        - month
        - label
        - rank
      properties:
        month:
          type: string
          description: 랭킹 기준 월 (yyyy-MM)
        label:
          type: string
          description: 화면 표시용 월 라벨
        rank:
          type: integer
          format: int64
          description: 해당 월의 순위
          x-java-primitive: true
      description: 마이페이지 랭킹 히스토리 정보
    RankSummaryResponse:
      type: object
      required:
        - cards
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/RankCardResponse'
      description: 마이페이지 랭킹 요약 응답
    ReadingCalendarDayResponse:
      type: object
      required:
        - date
        - read
        - readCount
      properties:
        date:
          type: string
          format: date
          description: 날짜 (yyyy-MM-dd)
        read:
          type: boolean
          description: 해당 날짜에 아티클을 읽었는지 여부
        readCount:
          type: integer
          format: int64
          description: 해당 날짜에 읽은 아티클 수
          x-java-primitive: true
      description: 읽기 캘린더의 하루 정보
    ReadingDashboardResponse:
      type: object
      required:
        - readArticleCount
        - readArticleChangeRate
        - readArticleChangeDirection
        - bookmarkCount
        - frequentReadNewsletters
      properties:
        readArticleCount:
          type: integer
          format: int64
          description: 이번 달 읽은 아티클 수
          x-java-primitive: true
        readArticleChangeRate:
          type: number
          format: double
          nullable: true
          description: 지난 달 대비 읽은 아티클 수 증감률 (%)
        readArticleChangeDirection:
          allOf:
            - $ref: '#/components/schemas/ChangeDirection'
          nullable: true
        bookmarkCount:
          type: integer
          format: int64
          description: 북마크 개수
          x-java-primitive: true
        frequentReadNewsletters:
          type: array
          items:
            $ref: '#/components/schemas/FrequentReadNewsletterResponse'
          description: 자주 읽은 뉴스레터 TOP
      description: 월간 읽기 대시보드 응답
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 세션 쿠키 기반 인증
servers:
  - url: https://api.bombom.news
    description: BomBom Production API
    variables: {}
